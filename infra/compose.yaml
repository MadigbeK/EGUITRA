# Plateforme EGUITRA : noyau Odoo 19, PostgreSQL 16 et applications web (Next.js).
# Lancement : infra/up.sh (rend odoo.conf, récupère OCA, construit, démarre).
# Aucun port n'est publié sur l'extérieur : Docker contourne le pare-feu pour les ports
# publiés, donc le noyau n'écoute que sur 127.0.0.1 (accès par tunnel SSH ou par le proxy).
name: eguitra

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      # Archivage continu des WAL (backup/archive-wal.sh) : au plus 15 minutes de données
      # exposées même en faible activité (archive_timeout), restauration à un instant donné.
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=900
      - -c
      - archive_command=sh /usr/local/bin/archive-wal.sh %p %f
    volumes:
      - db-data:/var/lib/postgresql/data
      # Seul le répertoire des WAL est monté : le reste des sauvegardes reste inaccessible au serveur.
      - ${BACKUP_DIR:-/srv/eguitra/backup}/wal:/backup/wal
      - ./backup/archive-wal.sh:/usr/local/bin/archive-wal.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    build:
      context: .
      dockerfile: odoo/Dockerfile
    image: eguitra/odoo:19.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["odoo", "-c", "/etc/odoo/odoo.conf"]
    ports:
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./oca-src:/mnt/oca:ro
      - ../addons:/mnt/extra-addons:ro

  web:
    build:
      context: ../apps/web
    image: eguitra/web:latest
    restart: unless-stopped
    depends_on:
      - odoo
    environment:
      ODOO_URL: http://odoo:8069
    ports:
      - "127.0.0.1:3000:3000"

  # Sauvegardes : de base chaque nuit, filestore toutes les 15 minutes, copie hors site chiffrée.
  backup:
    build:
      context: ./backup
    image: eguitra/backup:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      ODOO_DB: ${ODOO_DB}
      TZ: Africa/Conakry
    env_file:
      - path: ./backup.env
        required: false
    volumes:
      - ${BACKUP_DIR:-/srv/eguitra/backup}:/backup
      - odoo-data:/var/lib/odoo:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/check.sh"]
      interval: 5m
      timeout: 30s
      start_period: 30m
      retries: 1

  # Proxy d'entrée (TLS) : démarre avec « docker compose --profile proxy up -d » une fois les
  # noms de domaine pointés vers le serveur (sinon Let's Encrypt refuse les certificats).
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      - web
      - odoo
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      FINANCE_DOMAIN: ${FINANCE_DOMAIN:-}
      AXISPRO_DOMAIN: ${AXISPRO_DOMAIN:-}
      PORTAIL_DOMAIN: ${PORTAIL_DOMAIN:-}
      CORE_DOMAIN: ${CORE_DOMAIN:-}
      ADMIN_IPS: ${ADMIN_IPS:-127.0.0.1/32}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  odoo-data:
  caddy-data:
  caddy-config:
