services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PG_ODOO_PASSWORD: ${PG_ODOO_PASSWORD}
    command: >
      postgres -c wal_level=replica -c archive_mode=on
               -c archive_command='test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
               -c archive_timeout=900
               -c shared_buffers=1GB -c work_mem=32MB -c maintenance_work_mem=256MB
    volumes:
      - db-data:/var/lib/postgresql/data
      - wal-archive:/wal-archive
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql.tpl:ro
      - ./postgres/grant-readonly.sql:/grant-readonly.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data

  odoo:
    image: odoo:${ODOO_VERSION}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ../addons:/mnt/extra-addons/eguitra:ro
      - ./oca:/mnt/extra-addons/oca:ro
      - ./oca-src:/mnt/extra-addons/oca-src:ro
    expose:
      - "8069"
      - "8072"

  api:
    build: ../api
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_ROLE: api
      PG_PLATFORM_HOST: db
      PG_ODOO_HOST: db
      ODOO_URL: http://odoo:8069
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - api-backups:/data/backups
    expose:
      - "8000"

  worker:
    build: ../api
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE_ROLE: worker
      PG_PLATFORM_HOST: db
      PG_ODOO_HOST: db
      ODOO_URL: http://odoo:8069
    depends_on:
      - api
    volumes:
      - api-backups:/data/backups

  web:
    build: ../web
    restart: unless-stopped
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FINANCE_HOST: ${FINANCE_HOST}
      AXISPRO_HOST: ${AXISPRO_HOST}
      RECETTE_HOST: ${RECETTE_HOST}
      ADMIN_IPS: ${ADMIN_IPS}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  wal-archive:
  odoo-data:
  redis-data:
  api-backups:
  caddy-data:
  caddy-config:
