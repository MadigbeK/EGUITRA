[project]
name = "eguitra-api"
version = "0.1.0"
description = "EGUITRA Backend API — FastAPI + asyncpg + Pydantic v2"
requires-python = ">=3.12"
authors = [{name = "Madi KOUYATÉ", email = "elhadjmadigbe@gmail.com"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
    "argon2-cffi>=23.1.0",
    "redis[hiredis]>=5.0.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "arq>=0.26.0",
    "aiosmtplib>=3.0.0",
    "fpdf2>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S", "ASYNC"]
ignore = ["S101", "B008", "S608", "S603", "S105", "E501", "B904", "S110", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Le code est dans `app/`, pas dans `eguitra_api/`. On indique explicitement
# à Hatchling où trouver le package à packager.
packages = ["app"]
