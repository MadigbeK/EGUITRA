<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIMOVA Terrain, maquettes HSSEQ</title>
<!-- Seule ressource externe : les deux polices de la charte (repli système si elles manquent). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@600;700;800&family=Funnel+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
 * Maquettes cliquables de NIMOVA Terrain (Expo, Android d'abord), parcours HSSEQ.
 * Système : docs/design/mobile/systeme-terrain.md. Les mesures sont en dp (1 px CSS = 1 dp ici) :
 * téléphone 390 × 844, tablette 1024 × 768, barres système Android comprises.
 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:"Funnel Sans","Segoe UI",system-ui,sans-serif;background:#e4eae6;color:#10241f;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ─── Page de présentation (hors système) ─────────────────────────────── */
.page{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
.menu{position:sticky;top:0;height:100vh;overflow:auto;background:#142f29;color:#dfe9e3;padding:20px 14px 28px}
.marque{display:flex;gap:12px;align-items:center;margin:0 4px 18px}
.marque b{display:block;font:700 18px/1.15 "Funnel Display","Funnel Sans",sans-serif;color:#fff}
.marque span{font-size:13px;color:#a5e6c2}
.reglages{display:grid;gap:10px;margin-bottom:20px;padding:12px;border-radius:10px;background:rgb(255 255 255/.06)}
.reglage{display:grid;gap:5px}
.reglage>span{font-size:12.5px;color:#b9cbc2}
.segm{display:flex;gap:3px;padding:3px;border-radius:8px;background:rgb(0 0 0/.28)}
.segm button{flex:1;padding:6px 4px;border-radius:6px;font-size:12.5px;color:#dfe9e3;text-align:center;white-space:nowrap}
.segm button[aria-pressed="true"]{background:#d3aa5b;color:#142f29;font-weight:600}
.parcours h2{display:flex;gap:8px;align-items:baseline;margin:0 4px;font:600 15px/1.3 "Funnel Display","Funnel Sans",sans-serif;color:#fff}
.parcours h2 i{font-style:normal;color:#d3aa5b}
.parcours p{margin:2px 4px 6px 22px;font-size:12.5px;color:#a9bdb3}
.parcours ol{list-style:none;display:grid;gap:1px;margin-bottom:14px}
.parcours li button{width:100%;padding:6px 10px 6px 22px;border-radius:6px;font-size:13.5px;color:#d5e2db}
.parcours li button:hover{background:rgb(255 255 255/.07)}
.parcours li button[aria-current="step"]{background:rgb(165 230 194/.17);color:#fff;font-weight:600}
.menu-pied{margin:8px 4px 0;font-size:12.5px;line-height:1.45;color:#a9bdb3}
.menu-pied code{color:#e6c47e;font-size:12px}
.scene{display:flex;flex-wrap:wrap;align-items:flex-start;gap:28px;padding:28px;min-width:0;overflow-x:auto}
.appareil{flex:none;padding:11px;border-radius:46px;background:#0d1412;box-shadow:0 30px 60px -30px rgb(16 36 31/.55),inset 0 0 0 1px #2c3a35}
.appareil.tab{padding:16px;border-radius:28px}
.notes{flex:1 1 300px;max-width:420px;min-width:280px;padding:18px 20px;border-radius:10px;background:#f9f8f5;box-shadow:0 0 0 1px rgb(16 36 31/.05),0 16px 32px -22px rgb(16 36 31/.26);font-size:14px;line-height:1.5}
.notes h2{font:700 19px/1.25 "Funnel Display","Funnel Sans",sans-serif;margin-bottom:2px}
.notes .qui{color:#5c6e66;margin-bottom:12px}
.notes h3{font:600 13px/1.3 "Funnel Sans",sans-serif;color:#344a42;margin:14px 0 4px}
.notes ul{padding-left:18px;display:grid;gap:5px}
.notes .retour-geste{margin-top:14px;padding:8px 10px;border-radius:8px;background:#eef2ef;color:#344a42;font-size:13px}
.notes .retour-geste b{color:#10241f}
.notes .astuce{margin-top:12px;font-size:13px;color:#5c6e66}

/* ─── Écran : jetons du terrain ───────────────────────────────────────── */
.ecran{
  --f-titre:"Funnel Display","Funnel Sans","Segoe UI",system-ui,sans-serif;
  --f-texte:"Funnel Sans","Segoe UI",system-ui,sans-serif;
  position:relative;display:flex;flex-direction:column;width:390px;height:844px;overflow:hidden;border-radius:36px;
  background:var(--t-fond);color:var(--t-encre);font-family:var(--f-texte);font-size:17px;line-height:1.4;font-variant-numeric:tabular-nums lining-nums}
.appareil.tab .ecran{width:1024px;height:768px;border-radius:12px}
/* Plein soleil : fond clair, encre presque noire, 7:1 au moins pour tout texte. */
.ecran[data-mode="soleil"]{
  --t-fond:#e9eeeb;--t-surface:#ffffff;--t-surface-2:#f1f4f2;--t-filet:#d3ddd7;--t-filet-fort:#b4c2ba;--t-trait:#4f625a;
  --t-encre:#0b1a16;--t-encre-2:#1f312b;--t-second:#3a4a44;
  --t-ok:#0a5c3d;--t-ok-plein:#0a5c3d;--t-ok-sur:#ffffff;--t-ok-doux:#e6f6ed;
  --t-danger:#9e2420;--t-danger-texte:#8a1d1a;--t-danger-plein:#9e2420;--t-danger-sur:#ffffff;--t-danger-doux:#fde6e3;
  --t-warn:#6b4300;--t-warn-trait:#8a5700;--t-warn-doux:#fdf0d5;
  --t-voile:rgb(11 26 22/.55);--t-ombre:0 -10px 24px -18px rgb(11 26 22/.45);--t-systeme:#ffffff;--t-systeme-encre:#1f312b;
  --t-entete-fin:#142f29;--t-entete-encre:#ffffff}
/* Nuit de cabine : luminance basse pour ne pas éblouir, contrastes gardés. */
.ecran[data-mode="nuit"]{
  --t-fond:#0a1210;--t-surface:#111c18;--t-surface-2:#18251f;--t-filet:#26352f;--t-filet-fort:#33453e;--t-trait:#6f857b;
  --t-encre:#e3ebe7;--t-encre-2:#c3d1ca;--t-second:#a9bbb2;
  --t-ok:#7fdcb0;--t-ok-plein:#155a3a;--t-ok-sur:#e6f4ec;--t-ok-doux:#12301f;
  --t-danger:#ff9d94;--t-danger-texte:#ff9d94;--t-danger-plein:#86231f;--t-danger-sur:#ffe9e6;--t-danger-doux:#3a1715;
  --t-warn:#f5c66b;--t-warn-trait:#f5c66b;--t-warn-doux:#33270c;
  --t-voile:rgb(0 0 0/.65);--t-ombre:0 -10px 24px -18px rgb(0 0 0/.8);--t-systeme:#0a1210;--t-systeme-encre:#c3d1ca;
  --t-entete-fin:#0a1210;--t-entete-encre:#e3ebe7}
/* Couleur du module : pétrole pour HSSEQ, latérite pour Rotations. Elle ne dit jamais un état. */
.app[data-module="hsseq"]{--t-accent:#0a6e86;--t-accent-texte:#075668;--t-accent-plein:#075668;--t-accent-sur:#ffffff;--t-accent-doux:#e2f2f6;--t-entete-1:#075668;--t-entete-2:#063f4c}
.app[data-module="rotations"]{--t-accent:#b83e16;--t-accent-texte:#983210;--t-accent-plein:#983210;--t-accent-sur:#ffffff;--t-accent-doux:#fdebe4;--t-entete-1:#983210;--t-entete-2:#7a2a10}
.ecran[data-mode="nuit"] .app[data-module="hsseq"]{--t-accent:#3fb6d1;--t-accent-texte:#6fd0e6;--t-accent-plein:#0b4b5a;--t-accent-sur:#e2f6fb;--t-accent-doux:#0c2a31;--t-entete-1:#0b3f4c;--t-entete-2:#082c35}
.ecran[data-mode="nuit"] .app[data-module="rotations"]{--t-accent:#ff8a63;--t-accent-texte:#ff9b74;--t-accent-plein:#7a2a10;--t-accent-sur:#fff1ea;--t-accent-doux:#35170c;--t-entete-1:#5e200b;--t-entete-2:#3f1608}
.ecran :focus-visible{outline:3px solid var(--t-encre);outline-offset:2px}

/* ─── Barres système Android ──────────────────────────────────────────── */
.statut{flex:none;display:flex;align-items:center;justify-content:space-between;height:24px;padding:0 16px 0 20px;font:500 13px/1 "Segoe UI",Roboto,system-ui,sans-serif;color:var(--t-entete-encre);background:var(--t-entete-1)}
.statut.noir{background:#000;color:#fff}
.statut.foret{background:#142f29;color:#fff}
.statut .droite{display:flex;align-items:center;gap:6px}
.statut svg{display:block}
.nav-sys{flex:none;display:flex;align-items:center;justify-content:space-around;height:48px;padding:0 48px;background:var(--t-systeme);color:var(--t-systeme-encre);border-top:1px solid var(--t-filet)}
.nav-sys.noir{background:#000;color:#e8ece9;border-color:#000}
.nav-sys.foret{background:#142f29;color:#dfe9e3;border-color:#142f29}
.nav-sys button{display:grid;place-items:center;width:64px;height:44px;border-radius:22px}
.nav-sys button:hover{background:rgb(128 128 128/.15)}
.nav-sys.kiosque{justify-content:flex-start;padding-left:24px}

/* ─── Application ─────────────────────────────────────────────────────── */
.app{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--t-fond)}
.ic{width:24px;height:24px;flex:none}
.ic.s20{width:20px;height:20px}.ic.s28{width:28px;height:28px}.ic.s32{width:32px;height:32px}.ic.s40{width:40px;height:40px}.ic.s56{width:56px;height:56px}

/* En-tête de terrain : dégradé de marque qui part de la couleur forte du module (texte blanc à 7:1),
   le pli en tuile sur les écrans d'accueil, en filigrane partout. */
.entete{position:relative;flex:none;display:flex;align-items:center;gap:10px;height:64px;padding:0 8px 0 16px;overflow:hidden;color:var(--t-entete-encre);background:linear-gradient(135deg,var(--t-entete-1) 0%,var(--t-entete-2) 62%,var(--t-entete-fin) 140%)}
.entete.avec-retour{padding-left:4px}
.entete .filigrane{position:absolute;right:96px;top:-30px;width:120px;height:120px;opacity:.1;pointer-events:none}
.entete .tuile{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:12px;background:rgb(255 255 255/.14)}
.entete .haut{display:grid;place-items:center;width:56px;height:56px;flex:none;border-radius:28px}
.entete .haut:hover{background:rgb(255 255 255/.1)}
.entete .titres{position:relative;min-width:0;flex:1;line-height:1.15}
.entete h1{font:700 19px/1.15 var(--f-titre);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entete .sous{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pastille{position:relative;display:grid;place-items:center;min-height:56px;min-width:56px;flex:none;border-radius:28px}
.pastille>span{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;font-size:15px;font-weight:600;white-space:nowrap}
.pastille .ligne{background:rgb(255 255 255/.15);color:#fff}
.ecran[data-mode="nuit"] .pastille .ligne{color:#e3ebe7}
.pastille .alerte{background:#d3aa5b;color:#0b1a16}
.pastille .point{width:9px;height:9px;border-radius:50%;background:#a5e6c2}
.pastille .nb{display:grid;place-items:center;min-width:24px;height:24px;margin-right:-6px;padding:0 6px;border-radius:12px;background:#142f29;color:#fff;font:700 15px/1 var(--f-titre)}
.utilisateur-btn{display:flex;align-items:center;gap:10px;min-height:56px;padding:4px 14px 4px 6px;border-radius:28px;background:rgb(255 255 255/.12);text-align:left;line-height:1.15}
.utilisateur-btn b{display:block;font-size:15px}
.utilisateur-btn span.r{font-size:15px;opacity:.95}

/* Contenu qui défile entre l'en-tête et la barre d'action. */
.defile{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.defile.bas{justify-content:flex-end}
.feuille{background:var(--t-surface);border-radius:14px;padding:16px}
.titre-fort{font:700 30px/1.1 var(--f-titre);letter-spacing:-.01em}
.titre{font:700 24px/1.15 var(--f-titre)}
.section{font:700 19px/1.2 var(--f-titre);margin-top:4px}
.libelle{font-weight:600;font-size:17px}
.second{color:var(--t-second)}
.service{font-size:15px;font-weight:600;line-height:20px;color:var(--t-second)}
.texte-ok{color:var(--t-ok)}.texte-danger{color:var(--t-danger-texte)}.texte-warn{color:var(--t-warn)}.texte-accent{color:var(--t-accent-texte)}
.ligne-flex{display:flex;align-items:center;gap:12px}
.espace{flex:1}
.w100{width:100%}

/* Boutons : 64 dp pour l'action principale, 56 dp au moins partout. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:0 20px;border-radius:12px;border:2px solid transparent;font:600 18px/1.2 var(--f-texte);text-align:center;transition:transform 80ms,filter 80ms}
.btn:active{transform:scale(.98);filter:brightness(.92)}
.btn-56{min-height:56px;font-size:17px;padding:0 16px}
.btn-plein{background:var(--t-accent-plein);color:var(--t-accent-sur)}
.btn-trait{background:var(--t-surface);color:var(--t-encre);border-color:var(--t-trait)}
.btn-danger{background:var(--t-danger-plein);color:var(--t-danger-sur)}
.btn-danger-trait{background:var(--t-surface);color:var(--t-danger-texte);border-color:var(--t-danger)}
.btn-ok{background:var(--t-ok-plein);color:var(--t-ok-sur)}
.btn[disabled]{background:var(--t-surface-2);color:var(--t-second);border-color:var(--t-filet-fort);cursor:not-allowed;transform:none;filter:none}
.btn-rond{display:grid;place-items:center;width:56px;height:56px;border-radius:28px;color:#fff;background:rgb(255 255 255/.12)}

/* Barre d'action basse : un état d'une ligne, puis l'action principale sous le pouce. */
.barre{flex:none;padding:10px 16px 12px;background:var(--t-surface);border-top:1.5px solid var(--t-filet-fort);box-shadow:var(--t-ombre)}
.barre .etat{display:flex;align-items:flex-start;gap:8px;min-height:20px;margin-bottom:8px;font-size:15px;font-weight:600;line-height:20px;color:var(--t-second)}
.barre .etat .ic{width:20px;height:20px}
.barre .etat.ok{color:var(--t-ok)}.barre .etat.danger{color:var(--t-danger-texte)}.barre .etat.warn{color:var(--t-warn)}
.barre .actions{display:flex;gap:12px}
.barre .actions>*{flex:1}
.barre .actions>.fixe{flex:none}
.barre .actions.pile{flex-direction:column}

/* Tampons d'état : rayon 4, filet, le mot en toutes lettres ; plein pour ce qui demande une action. */
.tampon{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border:1.5px solid;border-radius:4px;font-size:15px;font-weight:600;line-height:20px;white-space:nowrap}
.tampon .ic{width:16px;height:16px}
.tampon.ok{color:var(--t-ok);border-color:var(--t-ok)}
.tampon.neutre{color:var(--t-encre-2);border-color:var(--t-trait)}
.tampon.warn{color:var(--t-warn);border-color:var(--t-warn-trait);background:var(--t-warn-doux)}
.tampon.danger{color:var(--t-danger-texte);border-color:var(--t-danger);background:var(--t-danger-doux)}
.code{display:inline-grid;place-items:center;min-width:44px;height:28px;padding:0 6px;border-radius:4px;background:var(--t-encre);color:var(--t-surface);font:700 15px/1 var(--f-titre);letter-spacing:.02em}
.etiquette{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--t-encre-2)}
.etiquette .ic{width:20px;height:20px}

/* Rotation du jour et tâches. */
.rot-tete{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rot-dl{display:grid;gap:6px;margin-top:12px;padding-top:12px;border-top:1.5px solid var(--t-filet)}
.rot-dl div{display:grid;grid-template-columns:104px 1fr;gap:8px}
.rot-dl dt{font-size:15px;font-weight:600;color:var(--t-second);line-height:24px}
.rot-dl dd{font-weight:500}
.liste{display:grid;gap:10px}
.tache{display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:12px 8px 12px 12px;border-radius:14px;background:var(--t-surface);text-align:left}
.tache .pic{display:grid;place-items:center;width:48px;height:48px;flex:none;border-radius:12px;background:var(--t-accent-doux);color:var(--t-accent-texte)}
.app[data-module="rotations"] .tache .pic.hsseq{background:#e2f2f6;color:#075668}
.ecran[data-mode="nuit"] .app[data-module="rotations"] .tache .pic.hsseq{background:#0c2a31;color:#6fd0e6}
.tache .corps{flex:1;min-width:0}
.tache .corps .libelle{display:block}
.tache .corps .sous{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:15px;font-weight:600;color:var(--t-second)}
.tache .chev{color:var(--t-second)}
.tache.declarer{border:2px dashed var(--t-trait)}

/* Progression et minuteur discret. */
.progression{flex:none;display:grid;gap:8px;padding:10px 16px 12px;background:var(--t-surface);border-bottom:1.5px solid var(--t-filet)}
.progression .ligne-flex{justify-content:space-between}
.progression .compte{font-size:15px;font-weight:600;color:var(--t-encre-2)}
.minuteur{display:inline-flex;align-items:center;gap:5px;font-size:15px;font-weight:600;color:var(--t-second)}
.minuteur .ic{width:18px;height:18px}
.segments{display:flex;gap:8px}
.segments .groupe{display:flex;gap:3px}
.segments .groupe.crit{flex:7}.segments .groupe.nb{flex:5}
.seg{flex:1;height:8px;border-radius:2px;background:var(--t-filet-fort)}
.seg.fait{background:var(--t-accent)}
.seg.nc{background:var(--t-danger)}
.seg.courant{background:var(--t-encre)}

/* Point de contrôle : deux réponses géantes, sous le pouce. */
.precedent{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--t-surface);font-size:15px;font-weight:600;color:var(--t-encre-2)}
.precedent .ic{width:20px;height:20px}
.precedent .c{color:var(--t-ok)}.precedent .n{color:var(--t-danger)}
.precedent span.txt{flex:1;min-width:0}
.titre-point{font:700 30px/1.12 var(--f-titre);letter-spacing:-.01em}
.consigne{font-size:17px;color:var(--t-encre-2)}
.zone-pouce{flex:none;padding:12px 16px 16px;background:var(--t-fond)}
.cnc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cnc .choix{--marque:var(--t-surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;border-radius:14px;border:2.5px solid;background:var(--t-surface);font:700 19px/1.1 var(--f-texte);transition:transform 80ms}
.cnc .choix:active{transform:scale(.98)}
.cnc .choix.c{order:2;color:var(--t-ok);border-color:var(--t-ok)}
.cnc .choix.nc{order:1;color:var(--t-danger-texte);border-color:var(--t-danger)}
.main-gauche .cnc .choix.c{order:1}.main-gauche .cnc .choix.nc{order:2}
.cnc .choix.c[aria-pressed="true"]{--marque:var(--t-ok-plein);background:var(--t-ok-plein);color:var(--t-ok-sur);border-color:var(--t-ok-plein)}
.cnc .choix.nc[aria-pressed="true"]{--marque:var(--t-danger-plein);background:var(--t-danger-plein);color:var(--t-danger-sur);border-color:var(--t-danger-plein)}
.cnc .choix .ic{width:32px;height:32px}
.cnc.compact .choix{flex-direction:row;min-height:56px;gap:8px;font-size:17px}
.cnc.compact .choix .ic{width:22px;height:22px}
.ligne-nb{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--t-surface)}

/* Photo obligatoire. */
.puces{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.puce{min-height:56px;padding:6px 12px;border-radius:12px;border:2px solid var(--t-trait);background:var(--t-surface);font-weight:600;text-align:center}
.puce[aria-pressed="true"]{border-color:var(--t-encre);background:var(--t-encre);color:var(--t-surface)}
.photo-requise{display:flex;align-items:center;gap:14px;width:100%;min-height:104px;padding:16px;border-radius:14px;border:2.5px dashed var(--t-danger);background:var(--t-danger-doux);color:var(--t-danger-texte);text-align:left}
.photo-requise b{display:block;font-size:19px}
.photo-requise span{display:block;font-size:15px;font-weight:600;color:var(--t-encre-2)}
.photo-jointe{display:flex;gap:14px;align-items:center;padding:10px;border-radius:14px;background:var(--t-surface)}
.vignette{flex:none;width:120px;height:90px;border-radius:10px;overflow:hidden;background:#3b3f3c}
.vignette svg{display:block;width:100%;height:100%}
.vignette.grande{width:100%;height:160px}

const tampon = (mot, ton = "neutre", forme = "") => `<span class="tampon ${ton}">${forme}${mot}</span>`;
const pluriel = (n, un, plusieurs) => `${n} ${n > 1 ? plusieurs : un}`;
function heureDe(sec) { const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${String(s).padStart(2, "0")}`; }
function tempsControle() { const pos = Math.min(S.ctrl.i, 7); let s = 9 + pos * 15; if (S.ctrl.photo[1] && pos > 1) s += 26; if (S.ecran === "a6") s = 141; return s; }

function pastille() {
  const n = fileAttente().filter((e) => !e.envoye).length;
  const r = S.reseau;
  const mot = r === "ligne" ? "En ligne" : r === "faible" ? "Réseau faible" : "Hors réseau";
  const icone = r === "ligne" ? '<span class="point"></span>' : r === "faible" ? ic("wifi", "s20") : ic("nuage", "s20");
  const label = `${mot}, ${n ? pluriel(n, "saisie à envoyer", "saisies à envoyer") : "rien à envoyer"}. Ouvrir la file d’envoi.`;
  return `<button class="pastille" data-go="a10" aria-label="${label}"><span class="${r === "ligne" ? "ligne" : "alerte"}">${icone}${mot}${n ? `<span class="nb">${n}</span>` : ""}</span></button>`;
}
function entete({ titre, sous = "", retour = false, droite = null }) {
  const gauche = retour
    ? `<button class="haut" data-act="retour" aria-label="Revenir">${ic("haut")}</button>`
    : `<span class="tuile">${pli("ic")}</span>`;
  return `<header class="entete${retour ? " avec-retour" : ""}">${pliTrait}${gauche}<div class="titres"><h1>${titre}</h1>${sous ? `<p class="sous">${sous}</p>` : ""}</div>${droite ?? pastille()}</header>`;
}
function bouton(o) {
  const attrs = [o.go ? `data-go="${o.go}"` : "", o.act ? `data-act="${o.act}"` : "", o.arg !== undefined ? `data-arg="${o.arg}"` : "", o.off ? "disabled" : "", o.label ? `aria-label="${o.label}"` : ""].join(" ");
  return `<button class="btn ${o.style ?? "btn-plein"} ${o.cls ?? ""}" ${attrs}>${o.ic ? ic(o.ic) : ""}${o.t}</button>`;
}
function barre({ etat = "", ton = "", icone = "", actions = [], pile = false }) {
  return `<footer class="barre"><p class="etat ${ton}" role="status">${icone ? ic(icone) : ""}<span>${etat}</span></p><div class="actions${pile ? " pile" : ""}">${actions.map(bouton).join("")}</div></footer>`;
}
function cnc(taille, cle, valeur, aria) {
  const compact = taille === "compact";
  return `<div class="cnc${compact ? " compact" : ""}" role="group" aria-label="${aria}">
    <button class="choix nc" aria-pressed="${valeur === "nc"}" data-act="${cle.act}" data-arg="${cle.arg}nc">${losange()}Non conforme</button>
    <button class="choix c" aria-pressed="${valeur === "c"}" data-act="${cle.act}" data-arg="${cle.arg}c">${disque()}Conforme</button>
  </div>`;
}
function progression() {
  const crit = CRIT.map((_, k) => {
    let c = "";
    if (S.ecran === "a6" || k < S.ctrl.i) c = S.ctrl.rep[k] === "nc" ? "nc" : "fait";
    else if (k === S.ctrl.i) c = "courant";
    return `<span class="seg ${c}"></span>`;
  }).join("");
  const nb = NB.map((_, k) => { const v = S.ctrl.nb[k]; return `<span class="seg ${v === "nc" ? "nc" : v ? "fait" : ""}"></span>`; }).join("");
  const faits = S.ecran === "a6" ? 7 + S.ctrl.nb.filter(Boolean).length : S.ctrl.i;
  const compte = S.ecran === "a6" ? "Points non bloquants" : `Point ${S.ctrl.i + 1} sur 12`;
  return `<div class="progression"><div class="ligne-flex"><span class="compte">${compte}</span><span class="minuteur" aria-label="Temps passé : ${heureDe(tempsControle())}">${ic("horloge")}${heureDe(tempsControle())}</span></div><div class="segments" role="progressbar" aria-label="Points remplis" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${faits}"><span class="groupe crit">${crit}</span><span class="groupe nb">${nb}</span></div></div>`;
}

  a8: () => ({ app: "tel", module: "hsseq", h: "05:44", titre: "Signature", qui: "Conducteur, téléphone",

/* ─── Tablette : écran de verrouillage partagé ─── */

  const droite = v.mode === "qr"
    ? `<h2>Présentez votre badge</h2><p class="doux">Tenez le badge devant la caméra, à une main de distance.</p><div class="lecteur">${qrBadge()}</div>
       <div class="ligne-flex">${bouton({ t: "Badge lu : Aïssatou Barry", act: "badge", cls: "espace" })}${bouton({ t: "Utiliser mon code", style: "btn-trait", act: "mode-code" })}</div>`

       <div class="cases" role="status" aria-label="${pluriel(v.pin.length, "chiffre saisi", "chiffres saisis")} sur 4">${[0, 1, 2, 3].map((k) => `<span class="case${k < v.pin.length ? "" : " vide"}">${k < v.pin.length ? "●" : "0"}</span>`).join("")}</div>
       <div class="pave" style="max-width:360px;width:100%;align-self:center">${["1", "2", "3", "4", "5", "6", "7", "8", "9"].map((k) => `<button class="touche" data-act="pin" data-arg="${k}">${k}</button>`).join("")}<button class="touche fn" data-act="mode-qr">${ic("qr", "s28")}</button><button class="touche" data-act="pin" data-arg="0">0</button><button class="touche fn" data-act="pin-corr" aria-label="Effacer">${ic("effacer", "s28")}</button></div>

       ${bouton({ t: "Scanner mon badge", style: "btn-trait", ic: "qr", act: "mode-qr" })}`;
  return { app: "tab", module: "hsseq", h: v.mode === "qr" ? "06:32" : "06:18", titre, qui: "Tablette partagée du dépôt", foret: true, kiosque: true, notes,
    composants: ["Changement d’utilisateur (§ 3.11)"], astuce: v.mode === "qr" ? "Touchez « Badge lu : Aïssatou Barry » pour ouvrir sa session." : "Choisissez Fatoumata Bangoura, puis tapez quatre chiffres.",

/* ─── Tablette du chef de parc ─── */
function departTampon(v) {
  if (v.id === "CT-07") {
    if (S.tab.leve && S.tab.derog === "accordee") return tampon("Sous dérogation", "warn");
    return tampon("Bloqué", "danger", losange());
  }
  return { bloque: tampon("Bloqué", "danger", losange()), route: tampon("En route"), autorise: tampon("Autorisé", "ok"), attente: tampon("À contrôler", "warn") }[v.dep];
}
function enteteTab(nom, role, ini) {
  const u = `<button class="utilisateur-btn" data-act="changer-user" aria-label="Changer d’utilisateur. Session de ${nom}">${avatar(ini)}<span><b>${nom}</b><span class="r">Changer d’utilisateur</span></span>${ic("changer")}</button>`;
  return `<header class="entete">${pliTrait}<span class="tuile">${pli("ic")}</span><div class="titres"><h1>NIMOVA · HSSEQ</h1><p class="sous">Dépôt SGP Conakry, lundi 26 octobre, ${role}</p></div>${pastille()}${u}</header>`;
}

/* Préréglage d'un écran atteint depuis le menu : l'état plausible à ce moment du parcours. */
function preparer(id) {
  const garde = { mode: S.mode, main: S.main, echelle: S.echelle };
  S = { ...etatInitial(), ...garde, ecran: id };

  if (id === "a3") { c.i = 0; }
  if (id === "a4" || id === "a5") { c.i = 1; c.rep = ["c", "nc"]; c.defaut[1] = "Coupure"; }
  if (id === "a6") { controleFini(); c.nb = [null, null, null, null, null]; }
  if (id === "a7" || id === "a8") controleFini();
  if (id === "a9" || id === "a10") { controleFini(); c.signe = true; c.enregistre = true; }
  if (p === "b") { controleFini(); c.signe = true; c.enregistre = true; }
  if (id === "b3") S.alco.fait = true;
  if (p === "c") { S.decl.type = "presque"; }
  if (id === "c1b") S.decl.type = "accident";
  if (id === "c3") { S.decl.photo = true; }
  if (id === "c4") { S.decl.photo = true; S.decl.texte = true; S.decl.faite = true; }
  if (p === "d") { controleFini(); c.signe = true; c.enregistre = true; S.alco.fait = true; S.envoye = true; }
  if (id === "d3") S.reseau = "hors";
  if (id === "d4") { S.tab.leve = true; S.tab.derog = "accordee"; }
  if (id === "e1") { S.verrou.qui = "fatoumata"; }
  if (id === "e3") S.tab.modale = "levee";
  if (id === "e4") S.tab.leve = true;
  if (id === "e5") { S.tab.leve = true; S.tab.modale = "derog"; }

/* ─── Retours (vibration, message) ─── */
function retourGeste(texte, motif) {
  S.retourGeste = texte;
  try { if (motif && navigator.vibrate) navigator.vibrate(motif); } catch (e) { /* bureau : sans vibreur */ }
}

/* ─── Navigation ─── */
function aller(id) { S.hist.push(S.ecran); S.ecran = id; }
const RETOUR_FIXE = { a9: "a1", b3: "a1", c4: "a1", a1: null, d4: "a1" };
function retourAndroid() {
  const E = ECRANS[S.ecran]();
  if (E.app === "tab") {
    if (S.tab.modale) { S.tab.modale = null; return retourGeste("Retour Android : la fenêtre se ferme, rien n’est envoyé."); }
    if (S.f.modale) { S.f.modale = null; S.f.code = ""; return retourGeste("Retour Android : la fenêtre se ferme."); }
    if (S.ecran === "e1" || S.ecran === "e7") return retourGeste("Retour Android : sans effet sur l’écran de verrouillage (mode kiosque).");
    return retourGeste("Retour Android : la tablette reste sur l’écran principal ; « Changer d’utilisateur » ferme la session.");
  }
  if (S.ecran in RETOUR_FIXE) {
    const cible = RETOUR_FIXE[S.ecran];
    if (!cible) return retourGeste("Retour Android : « Ma journée » est l’écran d’accueil ; l’application passe en arrière-plan sans rien perdre.");
    S.ecran = cible; S.hist = []; return retourGeste("Retour Android : après un enregistrement, retour à « Ma journée ».");
  }
  if (S.ecran === "a4") { S.ctrl.rep[S.ctrl.i] = undefined; S.ecran = "a3"; return retourGeste("Retour Android : la réponse « non conforme » est retirée, le point est à refaire."); }
  if (S.ecran === "a3" && S.ctrl.i > 0) { S.ctrl.i -= 1; S.ctrl.rep[S.ctrl.i] = undefined; return retourGeste("Retour Android : retour au point précédent."); }
  const prec = S.hist.pop();
  S.ecran = prec ?? "a1";
  retourGeste(["a3", "a6", "a7", "a8"].includes(prec) || S.ecran === "a2" ? "Retour Android : le contrôle reste en brouillon sur le téléphone." : "Retour Android : écran précédent.");
}

      if (v.qui === "fatoumata") { S.hist = []; S.ecran = "e2"; S.tab.modale = null; retourGeste("Session ouverte : Fatoumata Bangoura, chef de parc.", 40); }
      else if (v.qui === "aissatou") { S.hist = []; S.ecran = "f1"; retourGeste("Session ouverte : Aïssatou Barry, Responsable HSSEQ.", 40); }
      else v.message = "Maquette : choisissez Fatoumata Bangoura ou Aïssatou Barry.";
    }
  },
  "pin-corr": () => { S.verrou.pin = S.verrou.pin.slice(0, -1); },
  "mode-qr": () => { S.verrou.mode = "qr"; S.verrou.pin = ""; },
  "mode-code": () => { S.verrou.mode = "code"; S.verrou.qui = S.verrou.qui || "aissatou"; },
  badge: () => { S.hist = []; S.ecran = "f1"; S.f.sel = "d1"; retourGeste("Badge lu : session d’Aïssatou Barry, Responsable HSSEQ.", 40); },
  "changer-user": () => { S.tab.modale = null; S.f.modale = null; S.verrou = { qui: "", pin: "", mode: "qr", message: "" }; S.ecran = "e7"; S.hist = []; retourGeste("Session fermée : la tablette revient à l’écran de verrouillage."); },
  sel: (a) => { S.tab.sel = a; },
  filtre: (a) => { S.tab.filtre = a; },
  "ouvrir-levee": () => { S.tab.modale = "levee"; S.ecran = "e3"; },
  "photo-apres": () => { S.tab.photoApres = true; retourGeste("Photo de la réparation prise.", 30); },
  fait: (a) => { S.tab.fait = a; },
  lever: () => { S.tab.leve = true; S.tab.modale = null; S.ecran = "e4"; retourGeste("Vibration de réussite : V02 levé, signé par code.", 40); },
  "ouvrir-derog": () => { S.tab.modale = "derog"; S.ecran = "e5"; },
  v05: () => { S.tab.v05 = true; },
  "derog-envoyer": () => { S.tab.derog = "demandee"; S.tab.modale = null; S.ecran = "e6"; retourGeste("Demande envoyée : première validation donnée par code.", 40); },
  fermer: () => { S.tab.modale = null; S.ecran = S.tab.leve ? (S.tab.derog === "demandee" ? "e6" : "e4") : "e2"; },
  "f-sel": (a) => { S.f.sel = a; S.ecran = a === "alerte" ? (S.f.immob ? "f4" : "f3") : "f1"; },
  "f-ouvrir-code": () => { S.f.modale = "code"; S.f.code = ""; S.ecran = "f2"; },
  "f-pin": (a) => { S.f.code += a; if (S.f.code.length === 4) { S.f[S.f.sel] = "accordee"; if (S.f.sel === "d1") S.tab.derog = "accordee", S.tab.leve = true; S.f.modale = null; S.f.code = ""; S.ecran = "f1"; retourGeste("Vibration de réussite : dérogation accordée, Directeur général informé.", 40); } },
  "f-pin-corr": () => { S.f.code = S.f.code.slice(0, -1); },
  "f-fermer": () => { S.f.modale = null; S.f.code = ""; S.ecran = "f1"; },
  "f-refuser": () => { S.f[S.f.sel] = "refusee"; retourGeste("Refus enregistré : le motif du refus est demandé (non montré)."); },
  immob: () => { S.f.immob = true; S.ecran = "f4"; retourGeste("CT-11 immobilisé : motif V09 ouvert.", [60, 40, 60]); },
};

/* ─── Rendu ─── */
function barreStatut(h, cls) {
  const r = S.reseau;
  const barres = [0, 1, 2, 3].map((k) => `<rect x="${k * 4}" y="${10 - k * 3}" width="3" height="${2 + k * 3}" fill="currentColor" opacity="${(r === "ligne" ? 4 : r === "faible" ? 1 : 0) > k ? 1 : .3}"/>`).join("");
  return `<div class="statut ${cls}"><span>${h}</span><span class="droite">${r === "hors" ? '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6"/></svg>' : `<b style="font-size:11px">${r === "ligne" ? "4G" : "E"}</b>`}<svg width="16" height="13" viewBox="0 0 16 13" aria-hidden="true">${barres}</svg><svg width="22" height="12" viewBox="0 0 22 12" aria-hidden="true"><rect x=".75" y=".75" width="18" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="2.5" y="2.5" width="10" height="7" fill="currentColor"/><rect x="19.5" y="4" width="2" height="4" fill="currentColor"/></svg><span>64 %</span></span></div>`;
}
function barreNavigation(cls, kiosque) {
  const retour = `<button data-act="retour" aria-label="Retour Android"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M15 3.5L5.5 11 15 18.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>`;
  if (kiosque) return `<nav class="nav-sys kiosque ${cls}" aria-label="Navigation Android (mode kiosque)">${retour}</nav>`;
  return `<nav class="nav-sys ${cls}" aria-label="Navigation Android">${retour}<button data-act="info" data-arg="Bouton d’accueil Android : l’application passe en arrière-plan, la saisie en cours reste en brouillon." aria-label="Accueil Android"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button><button data-act="info" data-arg="Applications récentes : rien ne s’affiche de la saisie dans l’aperçu (écran masqué pour l’alcootest)." aria-label="Applications récentes"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="4.5" y="4.5" width="13" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button></nav>`;
}

/* Espaces insécables de la typographie française et des nombres. */
function typographie(racine) {
  const w = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    const t = n.nodeValue;
    const r = t.replace(/ ([;!?])/g, " $1").replace(/ :/g, " :").replace(/« /g, "« ").replace(/ »/g, " »")
      .replace(/(\d) (\d{3})(?!\d)/g, "$1 $2").replace(/(\d) (L|km|m|s|min|Ko|dp|%|caractères|points?|motifs?)(?![\wÀ-ÿ])/g, "$1 $2");
    if (r !== t) n.nodeValue = r;
  }
}

function rendre() {
  const E = ECRANS[S.ecran]();
  const appareil = document.getElementById("appareil");
  const ecran = document.getElementById("ecran");
  appareil.className = `appareil ${E.app === "tab" ? "tab" : "tel"}`;
  ecran.dataset.mode = S.mode;
  ecran.classList.toggle("main-gauche", S.main === "gauche");
  const cls = E.noir ? "noir" : E.foret ? "foret" : "";
  ecran.innerHTML = `<div class="app" data-module="${E.module}">${barreStatut(E.h, cls)}${E.html}${barreNavigation(cls, E.kiosque)}</div>`;
  // L'en-tête et la barre d'état se lisent dans la couleur du module : la barre d'état suit.
  typographie(ecran);
  // Échelle : réelle (1 px = 1 dp) ou ajustée à la fenêtre.
  const largeur = E.app === "tab" ? 1056 : 412;
  const dispo = document.querySelector(".scene").clientWidth - 56;
  appareil.style.zoom = S.echelle === "ajustee" && dispo < largeur ? (dispo / largeur).toFixed(3) : "";
  rendreMenu(); rendreNotes(E);
  const h = `#${S.ecran}${S.mode === "nuit" ? "/nuit" : ""}`;
  if (location.hash !== h) history.replaceState(null, "", h);
}

function rendreNotes(E) {
  const el = document.getElementById("notes");
  el.innerHTML = `<h2>${E.titre}</h2><p class="qui">${E.qui}</p>
    <h3>Ce que montre l’écran</h3><ul>${(E.notes ?? []).map((n) => `<li>${n}</li>`).join("")}</ul>
    ${E.composants ? `<h3>Composants du système</h3><ul>${E.composants.map((c) => `<li>${c}</li>`).join("")}</ul>` : ""}
    ${E.astuce ? `<p class="astuce">${E.astuce}</p>` : ""}
    ${S.retourGeste ? `<p class="retour-geste"><b>Dernier retour :</b> ${S.retourGeste}</p>` : ""}`;
  typographie(el);
}

function seg(nom, valeurs, courant) {
  return `<div class="segm" role="group" aria-label="${nom}">${valeurs.map(([v, l]) => `<button data-reglage="${nom}" data-val="${v}" aria-pressed="${courant === v}">${l}</button>`).join("")}</div>`;
}
function rendreMenu() {
  const m = document.getElementById("menu");
  m.innerHTML = `<div class="marque">${casque(40)}<div><b>NIMOVA Terrain</b><span>Maquettes HSSEQ, Android</span></div></div>
    <div class="reglages">
      <div class="reglage"><span>Mode d’affichage</span>${seg("mode", [["soleil", "Plein soleil"], ["nuit", "Nuit de cabine"]], S.mode)}</div>
      <div class="reglage"><span>Réseau</span>${seg("reseau", [["ligne", "En ligne"], ["faible", "Faible"], ["hors", "Hors réseau"]], S.reseau)}</div>
      <div class="reglage"><span>Main du pouce</span>${seg("main", [["droite", "Droite"], ["gauche", "Gauche"]], S.main)}</div>
      <div class="reglage"><span>Échelle</span>${seg("echelle", [["reelle", "Réelle"], ["ajustee", "Ajustée"]], S.echelle)}</div>
    </div>
    ${PARCOURS.map((p) => `<section class="parcours"><h2><i>${p.id}</i>${p.titre}</h2><p>${p.qui}</p><ol>${p.etapes.map(([id, l]) => `<li><button data-saut="${id}" aria-current="${S.ecran === id ? "step" : "false"}">${l}</button></li>`).join("")}</ol></section>`).join("")}
    <p class="menu-pied">Système : <code>systeme-terrain.md</code>. Données fictives. Le bouton retour de la barre Android fonctionne.</p>`;
  typographie(m);
}

document.addEventListener("click", (ev) => {
  const r = ev.target.closest("[data-reglage]");
  if (r) { S[r.dataset.reglage] = r.dataset.val; if (r.dataset.reglage === "reseau" && r.dataset.val === "ligne" && fileAttente().length) { S.envoye = true; S.retourGeste = "Réseau revenu : la file d’envoi part seule (06:03)."; } rendre(); return; }
  const saut = ev.target.closest("[data-saut]");
  if (saut) { preparer(saut.dataset.saut); rendre(); document.getElementById("appareil").scrollIntoView({ block: "nearest" }); return; }
  const b = ev.target.closest("#ecran [data-go], #ecran [data-act]");
  if (!b || b.disabled) return;
  if (b.dataset.act) { const res = ACTIONS[b.dataset.act]?.(b.dataset.arg); if (res === "differe") return; }
  else if (b.dataset.go) { if (b.dataset.go === "a1") S.hist = []; aller(b.dataset.go); S.retourGeste = ""; }
  rendre();
});
window.addEventListener("resize", () => { if (S.echelle === "ajustee") rendre(); });

/* Ouverture : #a4 ou #a4/nuit ouvre directement un écran (captures, liens). */
(function demarrer() {
  const [id, mode] = location.hash.slice(1).split("/");
  if (id && ECRANS[id]) preparer(id);
  if (mode === "nuit") S.mode = "nuit";
  rendre();
})();
</script>
